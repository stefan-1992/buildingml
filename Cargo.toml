[workspace]
resolver = "2"
members = [
    "crates/tree-sitter-buildingml",
    "crates/bml-core",
    "crates/bml-cli",
    "crates/bml-lsp",
    "crates/bml-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Stefan Fuchs"]

[workspace.dependencies]
# Parser
tree-sitter = "0.25"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive"] }

# IFC generation
ifc_rs = "0.1.0-alpha.9"
bevy_math = { version = "0.14", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# WASM
wasm-bindgen = "0.2"

# LSP
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# HTTP client (for chat API proxy)
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Environment
dotenvy = "0.15"

# Testing
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

[profile.release]
lto = true
opt-level = "s"
