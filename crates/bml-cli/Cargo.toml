[package]
name = "bml-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for BuildingML compiler"

[[bin]]
name = "buildingml"
path = "src/main.rs"

[dependencies]
bml-core = { path = "../bml-core" }
bml-lsp = { path = "../bml-lsp" }
# Fast native IFC reader (parse + mesh) for `ifc-scene` (CLI-only; kept out of
# bml-core/bml-wasm to avoid pulling its native deps into the WASM build).
ifc-lite-core = "4.1"
ifc-lite-geometry = "4.1"
clap.workspace = true
miette.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
dotenvy.workspace = true

[dev-dependencies]
tempfile.workspace = true
